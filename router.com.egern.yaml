name: router.com
description: Redirects router.com to the current IPv4 default gateway.
scriptings:
  - http_request:
      name: router.com gateway redirect
      match: '^https?://(www\.)?router\.com([:/?#]|$)'
      script_url: https://raw.githubusercontent.com/anybodyiskiller-cpu/Plugin/main/router.com.egern.js
mitm:
  hostnames:
    - router.com
    - www.router.com
